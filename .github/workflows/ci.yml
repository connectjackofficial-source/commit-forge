name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/commit_lint.py --message "feat(api): add endpoint"
      - run: python scripts/commit_lint.py --message "bad message"; exit 1
      - run: python scripts/changelog.py --help
